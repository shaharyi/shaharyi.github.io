<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>סימולטור רקורסיה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=JetBrains+Mono:wght@400;500;600&family=Rubik:wght@500;600&display=swap">
<style>
/* פריסה: שני חלונות זה לצד זה. עורך הקוד משמאל, אנימציית הרקורסיה מימין.
   הלוך = כחול (יורד), חזור = כתום (עולה). */
:root {
  --bg: #e6ebed;
  --panel: #fbfcfc;
  --panel-2: #eff3f4;
  --ink: #14202a;
  --ink-2: #485a66;
  --ink-3: #75858f;
  --line: #d0d9de;
  --fwd: #1c5bd0;
  --fwd-soft: #e2ecff;
  --ret: #bf5309;
  --ret-soft: #ffeadb;
  --good: #17744a;
  --bad: #c0303b;
  --bad-soft: #fde7e9;
  --code-bg: #fdfefe;
  --gutter: #f1f5f6;
  --kw: #7a3fc2; --ty: #0a756f; --fn: #1c5bd0; --str: #b04e14; --num: #0d6c97; --cm: #7d8c96;
  --hl-call: #dbe7ff; --hl-ret: #ffe5d2; --hl-err: #fbd5d9;
  --shadow: 0 1px 2px rgba(20,32,42,.08), 0 4px 14px rgba(20,32,42,.06);
  --font-ui: 'Assistant', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Rubik', 'Assistant', system-ui, sans-serif;
  --font-code: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --spd: 1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1217; --panel: #141c22; --panel-2: #1a242b; --ink: #e5edf1; --ink-2: #a5b5be; --ink-3: #74858f; --line: #263540;
    --fwd: #7ca6ff; --fwd-soft: #172a4d; --ret: #ffad5c; --ret-soft: #3b2512;
    --good: #5bd196; --bad: #ff7b86; --bad-soft: #3a171c;
    --code-bg: #10181d; --gutter: #162027;
    --kw: #c39bff; --ty: #62d6cc; --fn: #8db3ff; --str: #ffb27a; --num: #7cc6ec; --cm: #6f808a;
    --hl-call: #1b3260; --hl-ret: #47290f; --hl-err: #5a1f27;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1217; --panel: #141c22; --panel-2: #1a242b; --ink: #e5edf1; --ink-2: #a5b5be; --ink-3: #74858f; --line: #263540;
  --fwd: #7ca6ff; --fwd-soft: #172a4d; --ret: #ffad5c; --ret-soft: #3b2512;
  --good: #5bd196; --bad: #ff7b86; --bad-soft: #3a171c;
  --code-bg: #10181d; --gutter: #162027;
  --kw: #c39bff; --ty: #62d6cc; --fn: #8db3ff; --str: #ffb27a; --num: #7cc6ec; --cm: #6f808a;
  --hl-call: #1b3260; --hl-ret: #47290f; --hl-err: #5a1f27;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.45;
  padding-inline: 16px; padding-block: 12px;
}
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--fwd); outline-offset: 2px; }
.code { direction: ltr; unicode-bidi: isolate; font-family: var(--font-code); font-size: .92em; }

.app {
  direction: ltr;
  height: 100%;
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 12px;
}
.panel {
  min-width: 0; min-height: 0;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow);
}
.rtl { direction: rtl; }

/* ---------- סרגל כלים ---------- */
.toolbar {
  direction: rtl;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel-2);
}
.brand { font-family: var(--font-head); font-weight: 600; font-size: 15px; margin-inline-end: auto; letter-spacing: .1px; }
.ctrls { direction: ltr; display: flex; gap: 6px; align-items: center; }
.btn {
  direction: rtl;
  display: inline-flex; align-items: center; gap: 7px;
  height: 36px; padding: 0 13px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; font-weight: 600; font-size: 14px;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover:not(:disabled) { border-color: var(--ink-3); background: var(--panel-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: default; }
.btn svg { width: 15px; height: 15px; fill: currentColor; flex: none; }
.btn.run { background: var(--ink); color: var(--panel); border-color: var(--ink); min-width: 104px; justify-content: center; }
.btn.run:hover:not(:disabled) { background: var(--ink); border-color: var(--ink); filter: brightness(1.18); }
.speed { direction: rtl; display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 13px; font-weight: 600; }
.speed input[type=range] { width: 110px; accent-color: var(--fwd); }
.speed output { min-width: 3.1ch; text-align: end; font-family: var(--font-code); font-size: 12.5px; color: var(--ink); direction: ltr; }
.sel {
  direction: rtl; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel);
  padding: 0 10px; font-weight: 600; font-size: 14px; cursor: pointer; max-width: 100%;
}
.progress { direction: rtl; flex-basis: 100%; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.progress .bar { flex: 1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; direction: rtl; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--fwd); transition: width .2s; }
.progress .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.progress b { font-family: var(--font-code); font-weight: 500; color: var(--ink); direction: ltr; unicode-bidi: isolate; }

/* ---------- עורך ---------- */
.editor-wrap { position: relative; flex: 1 1 auto; min-height: 220px; display: flex; background: var(--code-bg); overflow: hidden; }
.gutter {
  flex: none; width: 46px; background: var(--gutter); border-inline-end: 1px solid var(--line);
  overflow: hidden; position: relative; user-select: none;
}
.gutter-in { position: absolute; inset-inline: 0; top: 0; padding-block: 10px; }
.gutter span { display: block; height: 21px; line-height: 21px; text-align: end; padding-inline-end: 9px; font: 12px/21px var(--font-code); color: var(--ink-3); }
.gutter span.on { color: var(--ink); font-weight: 700; }
.gutter span.err { color: var(--bad); font-weight: 700; }
.code-area { position: relative; flex: 1; min-width: 0; }
.hl, .ta {
  font: 13.5px/21px var(--font-code); tab-size: 4; letter-spacing: 0; white-space: pre; margin: 0;
  padding: 10px 14px; border: 0;
}
.hl-clip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.hl { position: absolute; top: 0; left: 0; min-width: 100%; color: var(--ink); }
.hl .ln { display: block; height: 21px; margin-inline: -14px; padding-inline: 14px; box-sizing: content-box; }
.hl .ln.call { background: var(--hl-call); box-shadow: inset 3px 0 0 var(--fwd); }
.hl .ln.ret { background: var(--hl-ret); box-shadow: inset 3px 0 0 var(--ret); }
.hl .ln.errl { background: var(--hl-err); box-shadow: inset 3px 0 0 var(--bad); }
.ta {
  position: absolute; inset: 0; width: 100%; height: 100%; resize: none; overflow: auto;
  background: transparent; color: transparent; caret-color: var(--ink); outline: none; direction: ltr; text-align: left;
}
.ta::selection { background: color-mix(in srgb, var(--fwd) 30%, transparent); color: transparent; }
.t-kw { color: var(--kw); font-weight: 500; } .t-ty { color: var(--ty); } .t-fn { color: var(--fn); }
.t-str { color: var(--str); } .t-num { color: var(--num); } .t-cm { color: var(--cm); font-style: italic; }

/* ---------- פלט ---------- */
.console { flex: none; height: 118px; border-top: 1px solid var(--line); display: flex; flex-direction: column; background: var(--panel); }
.console h3 { direction: rtl; margin: 0; padding: 6px 12px; font-size: 12px; font-weight: 700; letter-spacing: .6px; color: var(--ink-3); text-transform: uppercase; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.console pre { flex: 1; margin: 0; padding: 8px 12px; overflow: auto; font: 13px/1.55 var(--font-code); white-space: pre-wrap; unicode-bidi: plaintext; text-align: start; }
.console pre.empty { color: var(--ink-3); font-family: var(--font-ui); }
.console pre .e { color: var(--bad); }

/* ---------- אנימציה ---------- */
.viz { direction: rtl; }
.viz-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel-2); }
.viz-head h2 { margin: 0; font-family: var(--font-head); font-weight: 600; font-size: 15px; margin-inline-end: auto; }
.legend { display: flex; gap: 14px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 12px; height: 18px; }
.legend .f { color: var(--fwd); } .legend .r { color: var(--ret); }
.viz-scroll { flex: 1; min-height: 0; overflow: auto; padding: 18px 16px 24px; position: relative; scroll-behavior: smooth; }
.stack { direction: ltr; display: flex; flex-direction: column; align-items: flex-start; min-width: min-content; }

.win {
  direction: rtl; width: min(430px, calc(100% - var(--ind, 0px))); min-width: 220px; flex: none;
  background: var(--panel); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); overflow: hidden;
  transform-origin: 50% 0;
  transition: border-color .25s, box-shadow .25s;
}
.win .bar { display: flex; align-items: center; gap: 9px; padding: 6px 10px; background: var(--panel-2); border-bottom: 1px solid var(--line); transition: background .25s; }
.win .dots { display: inline-flex; gap: 4px; direction: ltr; }
.win .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.win .ttl { font-weight: 600; font-size: 13.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-inline-end: auto; direction: ltr; }
.win .num { font: 11.5px var(--font-code); color: var(--ink-3); direction: ltr; }
.win .body { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px; }
.params { display: flex; flex-wrap: wrap; gap: 5px 12px; direction: ltr; justify-content: flex-end; }
.params .p { font: 12.5px var(--font-code); color: var(--ink-2); }
.params .p b { color: var(--ink); font-weight: 600; }
.params .none { font: 12.5px var(--font-ui); color: var(--ink-3); direction: rtl; }
.status { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; min-height: 20px; }
.status .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--fwd); animation: pulse calc(1.1s * var(--spd)) ease-in-out infinite; flex: none; }
.gots { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--ink-3); }
.gots .chip { font: 12px var(--font-code); color: var(--ret); background: var(--ret-soft); padding: 1px 7px; border-radius: 99px; direction: ltr; }
.win.top { border-color: var(--fwd); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fwd) 18%, transparent), var(--shadow); }
.win.top .bar { background: var(--fwd-soft); }
.win.returning { border-color: var(--ret); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ret) 22%, transparent), var(--shadow); }
.win.returning .bar { background: var(--ret-soft); }
.win.returning .status { color: var(--ret); font-weight: 700; }
.win.err { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent), var(--shadow); }
.win.err .bar { background: var(--bad-soft); }
.win.err .status { color: var(--bad); font-weight: 700; }

.win.enter { animation: winIn calc(.42s * var(--spd)) cubic-bezier(.2,.8,.25,1) both; }
.win.closing { animation: winOut calc(.34s * var(--spd)) ease-in forwards; pointer-events: none; }
.link.closing { animation: linkOut calc(.34s * var(--spd)) ease-in forwards; }
/* קוד בתוך החלון */
.codebox { direction: ltr; text-align: left; margin: 0 -12px; border-block: 1px solid var(--line); background: var(--code-bg);
  max-height: 138px; overflow: auto; padding: 4px 0; font: 12px/18px var(--font-code); scroll-behavior: auto; }
.codebox .cl { display: flex; min-width: max-content; height: 18px; white-space: pre; }
.codebox .no { flex: none; width: 30px; text-align: end; padding-inline-end: 8px; color: var(--ink-3); user-select: none; }
.codebox .tx { padding-inline-end: 12px; color: var(--ink); }
.codebox .t-val { color: var(--fwd); font-weight: 700; background: color-mix(in srgb, var(--fwd) 14%, transparent); border-radius: 3px; padding: 0 2px; }
.codebox .cl.ret .t-val { color: var(--ret); background: color-mix(in srgb, var(--ret) 16%, transparent); }
.codebox .cl.wait { background: color-mix(in srgb, var(--fwd) 9%, transparent); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--fwd) 45%, transparent); }
.codebox .cl.cur { background: var(--hl-call); box-shadow: inset 3px 0 0 var(--fwd); }
.codebox .cl.ret { background: var(--hl-ret); box-shadow: inset 3px 0 0 var(--ret); }
.codebox .cl.errl { background: var(--hl-err); box-shadow: inset 3px 0 0 var(--bad); }
.codebox .cl.cur .no, .codebox .cl.ret .no, .codebox .cl.errl .no { color: var(--ink); font-weight: 700; }
@keyframes winIn { from { opacity: 0; transform: translateY(-14px) scale(.94); } to { opacity: 1; transform: none; } }
@keyframes winOut { 0% { opacity: 1; transform: none; max-height: 200px; } 60% { opacity: 0; transform: scale(.92); max-height: 200px; } 100% { opacity: 0; transform: scale(.92); max-height: 0; border-width: 0; margin: 0; } }
@keyframes linkOut { from { opacity: 1; height: 50px; } to { opacity: 0; height: 0; } }
@keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }

/* חיצים בין חלונות */
.link { direction: ltr; height: 50px; flex: none; display: flex; gap: 34px; align-items: stretch; overflow: hidden; }
.arr { display: flex; align-items: center; gap: 7px; }
.arr svg { width: 16px; height: 50px; flex: none; overflow: visible; }
.arr .lab { font: 12.5px var(--font-code); font-weight: 600; white-space: nowrap; }
.arr.down { color: var(--fwd); }
.arr.down .shaft { stroke-dasharray: 40; stroke-dashoffset: 0; }
.arr.down.enter .shaft { animation: draw calc(.42s * var(--spd)) ease-out both; }
.arr.down.enter .head { animation: fade calc(.42s * var(--spd)) ease-out both; }
.arr.up { color: var(--ink-3); visibility: hidden; } /* חץ חזור מוסתר עד שמתחיל תהליך החזרה */
.arr.up .shaft { stroke-dasharray: 3 4; }
.arr.up .lab { font-family: var(--font-ui); font-weight: 500; opacity: .85; }
.arr.up.on { color: var(--ret); visibility: visible; }
.arr.up.on .shaft { stroke-dasharray: 40; stroke-dashoffset: 0; animation: draw calc(.5s * var(--spd)) ease-out both; }
.arr.up.on .head { animation: fade calc(.5s * var(--spd)) ease-out both; }
.arr.up.on .lab { font-family: var(--font-code); font-weight: 700; opacity: 1; animation: fade calc(.5s * var(--spd)) ease-out both; }
@keyframes draw { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
@keyframes fade { 0%, 55% { opacity: 0; } 100% { opacity: 1; } }

.note { direction: rtl; margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 14px; max-width: 460px; }
.note.err { background: var(--bad-soft); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); font-weight: 600; }
.note.done { background: color-mix(in srgb, var(--good) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); color: var(--ink); }
.note.done b { color: var(--good); }
.empty-state { direction: rtl; margin: auto; max-width: 360px; text-align: center; color: var(--ink-2); padding: 30px 8px; }
.empty-state h3 { font-family: var(--font-head); font-size: 17px; margin: 0 0 6px; color: var(--ink); }
.empty-state p { margin: 0; }
.viz-scroll.is-empty { display: flex; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); }
  .editor-wrap { min-height: 300px; flex: none; }
  .panel.viz { min-height: 440px; }
  .viz-scroll { max-height: 70vh; }
  .brand { flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .win.enter, .win.closing, .link.closing, .arr * { animation-duration: .01s !important; }
  .viz-scroll { scroll-behavior: auto; }
  .status .pulse { animation: none; }
}

</style>

<div class="app">
  <section class="panel" aria-label="עורך קוד C#">
    <div class="toolbar">
      <div class="brand">סימולטור רקורסיה · C#</div>
      <select class="sel" id="ex" aria-label="בחירת דוגמה"></select>
      <div class="ctrls">
        <button class="btn" id="back" type="button" aria-label="צעד אחורה">
          <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="2.2" height="11" rx="1"/><path d="M13.5 2.5v11L5.5 8z"/></svg><span>אחורה</span>
        </button>
        <button class="btn run" id="run" type="button" aria-label="הרצה"></button>
        <button class="btn" id="fwd" type="button" aria-label="צעד קדימה">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 2.5v11L10.5 8z"/><rect x="11.8" y="2.5" width="2.2" height="11" rx="1"/></svg><span>קדימה</span>
        </button>
      </div>
      <label class="speed" for="spd">מהירות
        <input type="range" id="spd" min="0" max="8" step="1" value="3">
        <output id="spdOut" for="spd">×0.5</output>
      </label>
      <div class="progress" aria-live="polite">
        <span class="what" id="what"></span>
        <div class="bar" role="progressbar" aria-label="התקדמות הריצה"><i id="pbar"></i></div>

      </div>
    </div>
    <div class="editor-wrap">
      <div class="gutter" aria-hidden="true"><div class="gutter-in" id="gutIn"></div></div>

  <section class="panel viz" aria-label="אנימציית הרקורסיה">
    <div class="viz-head">

      <div class="legend">
        <span class="f"><svg viewBox="0 0 12 18" aria-hidden="true"><path d="M6 1v14M2 11l4 5 4-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>הלוך: קריאה</span>
        <span class="r"><svg viewBox="0 0 12 18" aria-hidden="true"><path d="M6 17V3M2 7l4-5 4 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>חזור: ערך מוחזר</span>
      </div>
    </div>
    <div class="viz-scroll is-empty" id="scroller">
      <div class="empty-state" id="empty"><h3>לחצו על הרץ</h3><p></p></div>

      <div id="note"></div>
    </div>
  </section>
</div>

<script>
/* ===================================================================
   מפרש לתת-קבוצה של C#  —  מפיק רשימת אירועים: call / return / print / error
   =================================================================== */
class CsError extends Error {
  constructor(msg, line) { super(msg); this.line = line || 0; this.name = 'CsError'; }
}
class D { constructor(v) { this.v = v; } }          // double
class Ch { constructor(c) { this.c = c; } }         // char

const NON_TYPE_START = new Set(['if','else','while','for','foreach','do','return','break','continue','new','this','true','false','null','switch','case','default','throw','try','catch','finally','using','lock','goto','in','is','as','typeof','sizeof','checked','unchecked','out','ref','const','namespace','class','struct','interface']);
const MODIFIERS = new Set(['public','private','protected','internal','static','readonly','const','override','virtual','abstract','sealed','async','unsafe','partial','extern']);
const CAST_TYPES = new Set(['int','long','double','float','decimal','char','byte','short','uint','ulong','string','bool','sbyte','ushort']);
const ASSIGN_OPS = new Set(['=','+=','-=','*=','/=','%=','&=','|=','^=']);
const BIN_PREC = { '??':1,'||':2,'&&':3,'|':4,'^':5,'&':6,'==':7,'!=':7,'<':8,'>':8,'<=':8,'>=':8,'+':9,'-':9,'*':10,'/':10,'%':10 };

/* ------------------------------ lexer ------------------------------ */
function lex(src, startLine) {
  const toks = []; let i = 0, line = startLine || 1; const n = src.length;
  const fail = (m) => { throw new CsError(m, line); };
  const OPS2 = ['++','--','+=','-=','*=','/=','%=','&=','|=','^=','==','!=','<=','>=','&&','||','=>','??'];
  const esc = (ch) => ({ n:'\n', t:'\t', r:'\r', '0':'\0', '\\':'\\', '"':'"', "'":"'" }[ch] ?? ch);

  while (i < n) {
    const c = src[i];
    if (c === '\n') { line++; i++; continue; }
    if (c === ' ' || c === '\t' || c === '\r' || c === '﻿') { i++; continue; }
    if (c === '/' && src[i+1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i+1] === '*') {
      i += 2;
      while (i < n && !(src[i] === '*' && src[i+1] === '/')) { if (src[i] === '\n') line++; i++; }
      i += 2; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
      toks.push({ t:'id', v:src.slice(i,j), line }); i = j; continue;
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || ''))) {
      let j = i;
      if (c === '0' && (src[i+1] === 'x' || src[i+1] === 'X')) {
        j = i + 2; while (/[0-9a-fA-F]/.test(src[j] || '')) j++;
        const v = parseInt(src.slice(i+2, j), 16);
        toks.push({ t:'num', v, kind: v > 2147483647 ? 'long' : 'int', line }); i = j; continue;
      }
      while (/[0-9_]/.test(src[j] || '')) j++;
      let isD = false;
      if (src[j] === '.' && /[0-9]/.test(src[j+1] || '')) { isD = true; j++; while (/[0-9_]/.test(src[j] || '')) j++; }
      if (/[eE]/.test(src[j] || '') && /[0-9+\-]/.test(src[j+1] || '')) { isD = true; j++; if (/[+\-]/.test(src[j])) j++; while (/[0-9]/.test(src[j] || '')) j++; }
      const txt = src.slice(i, j).replace(/_/g, '');
      let kind = isD ? 'double' : 'int'; const suf = src[j] || '';
      if (/[lL]/.test(suf) && !isD) { kind = 'long'; j++; }
      else if (/[dDfFmM]/.test(suf)) { kind = 'double'; j++; }
      let v;
      if (kind === 'double') v = Number(txt);
      else { const big = BigInt(txt); if (kind === 'int' && big > 2147483647n) kind = 'long'; v = kind === 'long' ? big : Number(big); }
      toks.push({ t:'num', v, kind, line }); i = j; continue;
    }
    if (c === '"' || (c === '@' && src[i+1] === '"') || (c === '$' && src[i+1] === '"') || ((c === '$' || c === '@') && (src[i+1] === '$' || src[i+1] === '@') && src[i+2] === '"')) {
      let interp = false, verb = false;
      while (src[i] !== '"') { if (src[i] === '$') interp = true; else verb = true; i++; }
      i++;
      const startL = line; let parts = [], cur = '';
      for (;;) {
        if (i >= n) fail('מחרוזת לא נסגרה');
        const ch = src[i];
        if (ch === '"') {
          if (verb && src[i+1] === '"') { cur += '"'; i += 2; continue; }
          i++; break;
        }
        if (ch === '\n') { if (!verb) fail('מחרוזת לא נסגרה בסוף השורה'); line++; cur += ch; i++; continue; }
        if (ch === '\\' && !verb) { cur += esc(src[i+1]); i += 2; continue; }
        if (interp && ch === '{') {
          if (src[i+1] === '{') { cur += '{'; i += 2; continue; }
          let j = i + 1, depth = 1;
          while (j < n && depth > 0) {
            if (src[j] === '"') { j++; while (j < n && src[j] !== '"') j++; }
            else if (src[j] === '{') depth++;
            else if (src[j] === '}') depth--;
            if (depth > 0) j++;
          }
          let body = src.slice(i + 1, j), fmtSpec = null, d = 0;
          for (let k = 0; k < body.length; k++) {
            const bc = body[k];
            if (bc === '(' || bc === '[') d++; else if (bc === ')' || bc === ']') d--;
            else if (bc === ':' && d === 0) { fmtSpec = body.slice(k + 1); body = body.slice(0, k); break; }
          }
          if (cur) parts.push(cur); cur = '';
          parts.push({ expr: body, fmt: fmtSpec, line });
          i = j + 1; continue;
        }
        if (interp && ch === '}' && src[i+1] === '}') { cur += '}'; i += 2; continue; }
        cur += ch; i++;
      }
      if (interp) { if (cur) parts.push(cur); toks.push({ t:'istr', parts, line: startL }); }
      else toks.push({ t:'str', v:cur, line: startL });
      continue;
    }
    if (c === "'") {
      let ch = src[i+1];
      if (ch === '\\') { ch = esc(src[i+2]); i += 4; } else i += 3;
      if (src[i-1] !== "'") fail("תו (char) לא תקין");
      toks.push({ t:'chr', v:ch, line }); continue;
    }
    const two = src.substr(i, 2);
    if (OPS2.includes(two)) { toks.push({ t:'op', v:two, line }); i += 2; continue; }
    if ('+-*/%<>=!&|^~?:;,.()[]{}'.includes(c)) { toks.push({ t:'op', v:c, line }); i++; continue; }
    fail(`תו לא מוכר: '${c}'`);
  }
  toks.push({ t:'eof', v:'סוף הקובץ', line });
  return toks;
}

/* ------------------------------ parser ------------------------------ */
class Parser {
  constructor(toks) { this.t = toks; this.p = 0; }
  get cur() { return this.t[this.p]; }
  peek(k = 1) { return this.t[Math.min(this.p + k, this.t.length - 1)]; }
  is(v) { const c = this.cur; return c.v === v && (c.t === 'op' || c.t === 'id'); }
  accept(v) { if (this.is(v)) { this.p++; return true; } return false; }
  fail(msg) { return new CsError(msg, this.cur.line); }
  expect(v) {
    if (!this.accept(v)) throw this.fail(`ציפיתי ל־'${v}' אבל נמצא '${this.cur.t === 'eof' ? 'סוף הקובץ' : (this.cur.v ?? this.cur.t)}'`);
  }
  ident() {
    const c = this.cur;
    if (c.t !== 'id') throw this.fail(`ציפיתי לשם אבל נמצא '${c.v ?? c.t}'`);
    this.p++; return c.v;
  }
  atEof() { return this.cur.t === 'eof'; }

  program() {
    const prog = { methods: [], fields: [], top: [], classes: [] };
    while (!this.atEof()) this.topItem(prog);
    return prog;
  }
  skipModifiers() { const s = new Set(); while (this.cur.t === 'id' && MODIFIERS.has(this.cur.v)) { s.add(this.cur.v); this.p++; } return s; }
  isTypeDeclStart() {
    const save = this.p; this.skipModifiers();
    const r = this.is('class') || this.is('struct') || this.is('interface');
    this.p = save; return r;
  }
  isMethodDeclStart() {
    const save = this.p;
    try {
      this.skipModifiers();
      if (this.cur.t !== 'id' || NON_TYPE_START.has(this.cur.v)) return false;
      this.parseType();
      return this.cur.t === 'id' && !NON_TYPE_START.has(this.cur.v) && this.peek().v === '(' && this.peek().t === 'op';
    } catch (e) { return false; }
    finally { this.p = save; }
  }
  topItem(prog) {
    if (this.is('using')) { while (!this.is(';') && !this.atEof()) this.p++; this.expect(';'); return; }
    if (this.is('namespace')) {
      this.p++; this.ident(); while (this.accept('.')) this.ident();
      if (this.accept(';')) return;
      this.expect('{'); while (!this.is('}') && !this.atEof()) this.topItem(prog); this.expect('}'); return;
    }
    if (this.isTypeDeclStart()) { this.classDecl(prog); return; }
    if (this.isMethodDeclStart()) { prog.methods.push(this.methodDecl()); return; }
    prog.top.push(this.statement());
  }
  classDecl(prog) {
    this.skipModifiers(); this.p++;   // class/struct/interface
    const name = this.ident(); prog.classes.push(name);
    if (this.accept(':')) { this.parseType(); while (this.accept(',')) this.parseType(); }
    this.expect('{');
    while (!this.is('}')) {
      if (this.atEof()) throw this.fail("חסר '}' לסגירת המחלקה");
      this.member(prog);
    }
    this.expect('}');
  }
  member(prog) {
    if (this.isTypeDeclStart()) { this.classDecl(prog); return; }
    if (this.isMethodDeclStart()) { prog.methods.push(this.methodDecl()); return; }
    const mods = this.skipModifiers();
    const type = this.parseType(); const nameTok = this.cur; const name = this.ident();
    for (;;) {
      let init = null;
      if (this.accept('=')) init = this.is('{') ? this.arrInit() : this.expr();
      prog.fields.push({ name, type, init, line: nameTok.line });
      if (this.accept(',')) { this.ident(); continue; }
      break;
    }
    this.expect(';');
  }
  methodDecl() {
    this.skipModifiers();

    this.expect('(');
    const params = [];
    if (!this.is(')')) {
      do {
        while (this.is('ref') || this.is('out') || this.is('params') || this.is('this')) this.p++;

        let def = null; if (this.accept('=')) def = this.expr();
        params.push({ type, name: pname, def });
      } while (this.accept(','));
    }
    this.expect(')');
    let body, endLine;
    if (this.accept('=>')) {
      const e = this.expr(); endLine = this.cur.line; this.expect(';');
      body = [{ k: 'ret', e, line: nameTok.line }];
    } else { const b = this.block(); body = b.body; endLine = b.endLine; }
    return { name, ret, params, body, line: nameTok.line, endLine };
  }
  parseType() {
    const tok = this.cur;
    if (tok.t !== 'id') throw this.fail('ציפיתי לשם של סוג');
    let name = tok.v; this.p++;
    while (this.is('.') && this.peek().t === 'id') { this.p++; name = this.cur.v; this.p++; }
    let args = null;
    if (this.is('<')) {
      this.p++; args = [];
      do { args.push(this.parseType()); } while (this.accept(','));
      this.expect('>');
    }
    let dims = 0;
    while (this.is('[') && this.peek().v === ']' && this.peek().t === 'op') { this.p += 2; dims++; }
    if (this.is('?') && (this.peek().t === 'id' || this.peek().v === ')') && !CAST_TYPES.has(name) === false) { /* nullable – ignore */ }
    return { name, args, dims };
  }
  block() {
    const line = this.cur.line; this.expect('{');
    const body = [];
    while (!this.is('}')) {
      if (this.atEof()) throw this.fail("חסר '}' לסגירת הבלוק");
      body.push(this.statement());
    }
    const endLine = this.cur.line; this.p++;

  tryDecl(forEach) {
    const save = this.p, t = this.cur;

    }
    this.p = save; return null;
  }
  declRest(type, line) {
    const vars = [];
    do {
      const name = this.ident(); let init = null;
      if (this.accept('=')) init = this.is('{') ? this.arrInit() : this.expr();
      vars.push({ name, init });
    } while (this.accept(','));
    return { k: 'decl', type, vars, line };
  }
  statement() {
    const t = this.cur, line = t.line;
    if (t.t === 'op') {
      if (t.v === '{') return this.block();
      if (t.v === ';') { this.p++; return { k: 'empty', line }; }

    if (t.t === 'id') {
      switch (t.v) {
        case 'if': {
          this.p++; this.expect('('); const c = this.expr(); this.expect(')');
          const a = this.statement(); let b = null;
          if (this.accept('else')) b = this.statement();
          return { k: 'if', c, a, b, line };
        }
        case 'while': { this.p++; this.expect('('); const c = this.expr(); this.expect(')'); return { k: 'while', c, body: this.statement(), line }; }
        case 'do': {
          this.p++; const body = this.statement(); this.expect('while'); this.expect('(');
          const c = this.expr(); this.expect(')'); this.expect(';'); return { k: 'do', c, body, line };
        }
        case 'for': {
          this.p++; this.expect('(');
          let init = null;
          if (!this.is(';')) {
            const ty = this.tryDecl(false);
            if (ty) init = this.declRest(ty, line);
            else { const list = [this.expr()]; while (this.accept(',')) list.push(this.expr()); init = { k: 'exprs', list, line }; }

          this.expect(';');
          const c = this.is(';') ? null : this.expr(); this.expect(';');
          const upd = [];
          if (!this.is(')')) { upd.push(this.expr()); while (this.accept(',')) upd.push(this.expr()); }
          this.expect(')');
          return { k: 'for', init, c, upd, body: this.statement(), line };

        case 'foreach': {
          this.p++; this.expect('('); const type = this.parseType(); const name = this.ident();
          this.expect('in'); const coll = this.expr(); this.expect(')');
          return { k: 'foreach', type, name, coll, body: this.statement(), line };
        }
        case 'return': {
          this.p++; let e = null; if (!this.is(';')) e = this.expr(); this.expect(';');
          return { k: 'ret', e, line };
        }
        case 'break': this.p++; this.expect(';'); return { k: 'break', line };
        case 'continue': this.p++; this.expect(';'); return { k: 'continue', line };
        case 'throw': { this.p++; const e = this.expr(); this.expect(';'); return { k: 'throw', e, line }; }
        case 'switch': throw this.fail('הפקודה switch עדיין לא נתמכת בסימולטור. אפשר להשתמש ב־if / else');
        case 'try': throw this.fail('הפקודה try/catch עדיין לא נתמכת בסימולטור');
        case 'const': this.p++; break;
      }
      const ty = this.tryDecl(false);
      if (ty) { const d = this.declRest(ty, line); this.expect(';'); return d; }
    }
    const e = this.expr(); this.expect(';');
    return { k: 'expr', e, line };
  }

  expr() { return this.assignment(); }
  isLvalue(e) { return e.k === 'id' || e.k === 'index' || e.k === 'member'; }
  assignment() {
    const left = this.ternary(); const t = this.cur;
    if (t.t === 'op' && ASSIGN_OPS.has(t.v)) {
      if (!this.isLvalue(left)) throw this.fail('צד שמאל של השמה חייב להיות משתנה, תא במערך או שדה');
      this.p++; const value = this.assignment();
      return { k: 'assign', op: t.v, target: left, value, line: t.line };
    }
    return left;
  }
  ternary() {
    const c = this.binary(1);
    if (this.is('?')) {
      const line = this.cur.line; this.p++;
      const a = this.assignment(); this.expect(':'); const b = this.assignment();
      return { k: 'cond', c, a, b, line };
    }
    return c;
  }
  binary(min) {
    let left = this.unary();
    for (;;) {
      const t = this.cur; if (t.t !== 'op') break;
      const pr = BIN_PREC[t.v]; if (!pr || pr < min) break;
      this.p++;
      const right = this.binary(t.v === '??' ? pr : pr + 1);
      left = { k: 'bin', op: t.v, l: left, r: right, line: t.line };
    }
    return left;
  }
  unary() {
    const t = this.cur;
    if (t.t === 'op') {
      if (t.v === '!' || t.v === '-' || t.v === '+' || t.v === '~') { this.p++; return { k: 'un', op: t.v, e: this.unary(), line: t.line }; }
      if (t.v === '++' || t.v === '--') {
        this.p++; const target = this.unary();
        if (!this.isLvalue(target)) throw this.fail('ניתן להשתמש ב־++ / -- רק על משתנה');
        return { k: 'incdec', op: t.v, prefix: true, target, line: t.line };
      }
      if (t.v === '(' && this.peek().t === 'id' && CAST_TYPES.has(this.peek().v) && this.peek(2).v === ')' && this.peek(2).t === 'op') {
        this.p++; const type = this.parseType(); this.expect(')');
        return { k: 'cast', type, e: this.unary(), line: t.line };
      }
    }
    return this.postfix();
  }
  postfix() {
    let e = this.primary();
    for (;;) {
      const t = this.cur; if (t.t !== 'op') break;
      if (t.v === '.') {
        this.p++; const nt = this.cur; const name = this.ident();
        if (this.is('(')) e = { k: 'mcall', obj: e, name, args: this.args(), line: nt.line };
        else e = { k: 'member', obj: e, name, line: nt.line };
        continue;
      }
      if (t.v === '[') {
        this.p++; const idx = this.expr(); this.expect(']');
        e = { k: 'index', obj: e, idx, line: t.line }; continue;
      }
      if (t.v === '++' || t.v === '--') {
        if (!this.isLvalue(e)) break;
        this.p++; e = { k: 'incdec', op: t.v, prefix: false, target: e, line: t.line }; continue;
      }
      break;
    }
    return e;
  }
  args() {
    this.expect('('); const a = [];
    if (!this.is(')')) {
      do {
        if (this.is('out') || this.is('ref')) throw this.fail('פרמטרים מסוג ref / out עדיין לא נתמכים בסימולטור');
        a.push(this.expr());
      } while (this.accept(','));
    }
    this.expect(')'); return a;
  }
  arrInit() {
    this.expect('{'); const items = [];
    while (!this.is('}')) {
      items.push(this.is('{') ? { k: 'arrlit', items: this.arrInit(), elem: null, line: this.cur.line } : this.expr());
      if (!this.accept(',')) break;
    }
    this.expect('}'); return items;
  }
  primary() {
    const t = this.cur, line = t.line;
    switch (t.t) {
      case 'num': this.p++; return { k: 'lit', val: t.kind === 'double' ? new D(t.v) : t.v, line };
      case 'str': this.p++; return { k: 'lit', val: t.v, line };
      case 'chr': this.p++; return { k: 'lit', val: new Ch(t.v), line };
      case 'istr': {
        this.p++;
        const parts = t.parts.map(pt => {
          if (typeof pt === 'string') return pt;
          const sub = new Parser(lex(pt.expr, pt.line)); const e = sub.expr();
          if (!sub.atEof()) throw new CsError('ביטוי לא תקין בתוך מחרוזת מושרת', pt.line);
          return { e, fmt: pt.fmt };
        });
        return { k: 'istr', parts, line };
      }
      case 'op':
        if (t.v === '(') { this.p++; const e = this.expr(); this.expect(')'); return e; }
        break;
      case 'id': {
        if (t.v === 'true') { this.p++; return { k: 'lit', val: true, line }; }
        if (t.v === 'false') { this.p++; return { k: 'lit', val: false, line }; }
        if (t.v === 'null') { this.p++; return { k: 'lit', val: null, line }; }
        if (t.v === 'new') return this.newExpr();
        if (this.peek().v === '(' && this.peek().t === 'op' && !NON_TYPE_START.has(t.v)) {
          this.p++; return { k: 'call', name: t.v, args: this.args(), line };
        }
        if (NON_TYPE_START.has(t.v) && t.v !== 'in') break;
        this.p++; return { k: 'id', name: t.v, line };
      }
    }
    throw this.fail(`לא הצלחתי להבין את '${t.t === 'eof' ? 'סוף הקובץ' : (t.v ?? t.t)}' כאן`);
  }
  newExpr() {
    const line = this.cur.line; this.p++;
    if (this.is('[')) { this.p++; this.expect(']'); return { k: 'arrlit', items: this.arrInit(), elem: null, line }; }
    const type = this.parseType();
    if (this.is('[')) {
      this.p++; const size = this.expr(); this.expect(']');
      return { k: 'newarr', elem: type, size, line };
    }
    if (type.dims > 0) {
      return { k: 'arrlit', items: this.arrInit(), elem: { ...type, dims: type.dims - 1 }, line };
    }
    const args = this.is('(') ? this.args() : [];
    let init = null; if (this.is('{')) init = this.arrInit();
    return { k: 'new', type, args, init, line };
  }
}

function parse(src) {
  const P = new Parser(lex(src));
  const prog = P.program();
  prog.lastLine = src.split('\n').length;
  return prog;
}

/* ------------------------------ values ------------------------------ */
const code = (c) => c.c.charCodeAt(0);
const isNum = (x) => typeof x === 'number' || typeof x === 'bigint' || x instanceof D || x instanceof Ch;
function num(x) { return x instanceof D ? x.v : x instanceof Ch ? code(x) : typeof x === 'bigint' ? Number(x) : x; }

  function later(baseMs, fn) {
    const rec = { fn };
    rec.t = setTimeout(() => { pend = pend.filter(x => x !== rec); fn(); }, Math.max(30, baseMs * spdF));
    pend.push(rec);
  }
  function flush() {
    const list = pend; pend = [];
    list.forEach(r => { clearTimeout(r.t); r.fn(); });
  }

  /* ---------- שחזור מצב מהאירועים ---------- */
  function stateAt(k) {
    const stack = []; let out = '', err = null;
    for (let i = 0; i < k; i++) {
      const ev = events[i];
      if (ev.type === 'call') {
        if (stack.length) { const pf = stack[stack.length - 1]; pf.child = ev.sig; pf.line = ev.line; }
        stack.push({ id: ev.id, sig: ev.sig, params: ev.params, depth: ev.depth, child: null, gots: [],
                     declLine: ev.declLine, endLine: ev.endLine, line: ev.declLine });
      } else if (ev.type === 'return') {
        stack.pop();
        const par = stack[stack.length - 1];
        if (par) { par.child = null; if (ev.hasValue) par.gots.push(ev.value); }
      } else if (ev.type === 'print') {
        out += ev.text + (ev.nl ? '\n' : '');
        if (stack.length && ev.line) stack[stack.length - 1].line = ev.line;
      } else if (ev.type === 'error') {
        err = ev;
        if (stack.length && ev.line) stack[stack.length - 1].line = ev.line;
      }
    }
    return { stack, out, err };
  }

  /* ---------- חלונות וחיצים ---------- */
  const entries = new Map(); let order = [];
  function indentPx(i) {
    const avail = Math.max(120, scroller.clientWidth - 32 - 400);
    const cap = Math.min(176, avail), step = 22, raw = i * step;
    if (raw <= cap) return raw;
    const capIdx = Math.floor(cap / step);
    return Math.min(capIdx * step + (i - capIdx) * 2, capIdx * step + 24);
  }

  function makeWin() {
    const w = document.createElement('div');
    w.className = 'win';
    w.innerHTML = '<div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="ttl code"></span><span class="num"></span></div>' +
      '<div class="body"><div class="params"></div><div class="codebox"></div><div class="status"></div><div class="gots"></div></div>';
    return w;
  }
  function makeLink() {
    const l = document.createElement('div');
    l.className = 'link';
    l.innerHTML =
      '<div class="arr down"><svg viewBox="0 0 16 50" aria-hidden="true"><line class="shaft" x1="8" y1="3" x2="8" y2="40" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="head" d="M2.5 36 L8 46 L13.5 36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lab"></span></div>' +
      '<div class="arr up"><svg viewBox="0 0 16 50" aria-hidden="true"><line class="shaft" x1="8" y1="47" x2="8" y2="10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path class="head" d="M2.5 14 L8 4 L13.5 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lab">חזור</span></div>';
    return l;
  }
  function createEntry(fr, i, animate) {
    const win = makeWin();
    win.style.marginLeft = indentPx(i) + 'px';
    win.style.setProperty('--ind', indentPx(i) + 'px');
    let link = null;
    if (i > 0) {
      link = makeLink();
      link.style.marginLeft = (indentPx(i - 1) + 16) + 'px';
      link.querySelector('.down .lab').textContent = fr.sig;
      if (animate) link.querySelector('.arr.down').classList.add('enter');
    }
    if (animate) win.classList.add('enter');
    if (link) stackEl.appendChild(link);
    stackEl.appendChild(win);
    return { win, link };
  }
  function removeEntry(en, animate) {
    const gone = () => { en.win.remove(); if (en.link) en.link.remove(); };
    if (!animate) { gone(); return; }
    en.win.classList.add('closing');
    if (en.link) en.link.classList.add('closing');
    later(360, gone);
  }
  /* קוד הפונקציה בתוך החלון, עם הדגשת השורה הנוכחית */
  let progHl = [], progRaw = [], progSrc = '';
  function buildCode(box, fr) {
    const a = fr.declLine || 1, b = Math.max(a, fr.endLine || a);
    let ind = Infinity;
    for (let n = a; n <= b; n++) {
      const raw = progRaw[n - 1] || '';
      if (raw.trim()) ind = Math.min(ind, /^[ \t]*/.exec(raw)[0].length);
    }
    if (!isFinite(ind)) ind = 0;
    const strip = new RegExp('^[ \\t]{0,' + ind + '}');
    /* ערכים ידועים: פרמטרים שהפונקציה לא משנה מוחלפים בערכם בגוף הקוד */
    const bodyTxt = progRaw.slice(a, b).join('\n');
    const known = new Map();
    (fr.params || []).forEach(p => {
      const nm = String(p.name).replace(/[^\w]/g, '');
      if (!nm) return;
      const assigned = new RegExp('\\b' + nm + '\\s*(?:=(?!=)|[-+*/%&|^]=|\\+\\+|--)|(?:\\+\\+|--)\\s*' + nm + '\\b|\\b(?:ref|out)\\s+' + nm + '\\b').test(bodyTxt);
      if (!assigned) known.set(p.name, String(p.text).replace(/\s*\n\s*/g, ' '));
    });
    const withVals = known.size ? highlight(progSrc, known) : progHl;
    let html = '';
    for (let n = a; n <= b; n++) {
      const row = n === a ? progHl : withVals;   /* שורת ההגדרה נשארת עם שמות הפרמטרים */
      html += `<div class="cl" data-n="${n}"><span class="no">${n}</span><span class="tx">${(row[n - 1] || '').replace(strip, '') || ' '}</span></div>`;
    }
    box.innerHTML = html;
    box.dataset.built = '1';
  }
  function markCode(win, fr, line, kind) {
    const box = win.querySelector('.codebox');
    if (!box.dataset.built) buildCode(box, fr);
    let target = null;
    box.querySelectorAll('.cl').forEach(el => {
      const on = +el.dataset.n === line;
      el.className = on ? 'cl ' + kind : 'cl';
      if (on) target = el;
    });
    if (target) {
      const t = target.offsetTop - box.clientHeight / 2 + 9;
      box.scrollTop = Math.max(0, t);
    }
  }
  function setStatus(win, html) { win.querySelector('.status').innerHTML = html; }
  function updateWin(en, fr, isTop, st) {
    const w = en.win;
    w.querySelector('.ttl').textContent = fr.sig;
    w.querySelector('.num').textContent = '#' + fr.id;
    w.querySelector('.params').innerHTML = fr.params.length
      ? fr.params.map(p => `<span class="p"><b>${esc(p.name)}</b> = ${esc(p.text)}</span>`).join('')
      : '<span class="none">ללא פרמטרים</span>';
    const hasErr = isTop && st.err;
    w.classList.toggle('top', isTop && !hasErr);
    w.classList.toggle('err', !!hasErr);
    w.classList.remove('returning');
    if (en.link) en.link.querySelector('.arr.up').classList.remove('on');
    markCode(w, fr, fr.line, hasErr ? 'errl' : isTop ? 'cur' : 'wait');
    if (hasErr) setStatus(w, 'השגיאה קרתה כאן');
    else if (isTop) setStatus(w, '<span class="pulse"></span>מחשב…');
    else setStatus(w, `ממתין ל־<span class="code">${esc(fr.child || '')}</span>`);
    const g = w.querySelector('.gots');
    g.innerHTML = fr.gots.length
      ? 'התקבל: ' + fr.gots.slice(-4).map(v => `<span class="chip">${esc(v)}</span>`).join('')
      : '';
  }
  function markReturning(ev) {
    const en = entries.get(ev.id);
    if (!en) return;
    en.win.classList.remove('top');
    en.win.classList.add('returning');
    { const f = findFrame(ev.id); if (f) markCode(en.win, f, ev.line || f.endLine, 'ret'); }
    setStatus(en.win, ev.hasValue ? `↩ מחזיר <span class="code">${esc(ev.value)}</span>` : '↩ מסיים (בלי ערך)');
    if (en.link) {
      const up = en.link.querySelector('.arr.up');
      up.classList.add('on');
      up.querySelector('.lab').textContent = ev.hasValue ? ev.value : 'סיום';
    }
  }
  function reconcile(st, animate) {
    const ids = st.stack.map(f => f.id);
    let keep = 0;
    while (keep < order.length && keep < ids.length && order[keep] === ids[keep]) keep++;
    for (let i = order.length - 1; i >= keep; i--) {
      const en = entries.get(order[i]);
      entries.delete(order[i]); order.pop();
      if (en) removeEntry(en, animate);
    }
    for (let i = keep; i < ids.length; i++) {
      entries.set(ids[i], createEntry(st.stack[i], i, animate));
      order.push(ids[i]);
    }
    st.stack.forEach((fr, i) => updateWin(entries.get(fr.id), fr, i === st.stack.length - 1, st));
    renderNote(st);
    requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });
  }
  function resetViz() {
    flush();
    stackEl.innerHTML = ''; entries.clear(); order = [];
  }
  function renderNote(st) {
    const showEmpty = cur === 0 && st.stack.length === 0;
    emptyEl.hidden = !showEmpty;
    scroller.classList.toggle('is-empty', showEmpty);
    noteEl.innerHTML = '';
    if (st.err) {
      noteEl.className = 'note err';
      noteEl.textContent = st.err.msg;
    } else if (N > 0 && cur >= N && st.stack.length === 0) {
      const calls = events.filter(e => e.type === 'call');
      const maxD = calls.reduce((m, e) => Math.max(m, e.depth), 1) - 1;
      noteEl.className = 'note done';
      noteEl.innerHTML = `<b>הריצה הסתיימה.</b> ${calls.length - 1} קריאות, עומק מקסימלי ${maxD}. כל החלונות נסגרו.`;
    } else { noteEl.className = ''; }
  }

  /* ---------- סטטוס, פלט וכפתורים ---------- */
  function describe(ev) {
    if (!ev) return compileError ? `שגיאה בשורה ${compileError.line}` : 'מוכן להרצה';
    const c = (t) => `<b>${esc(t)}</b>`;
    if (ev.type === 'call') return ev.depth === 1 ? `התוכנית מתחילה ב־${c(ev.name)}` : `קריאה ${c(ev.sig)}`;
    if (ev.type === 'return') return ev.hasValue ? `חזרה מ־${esc(ev.id ? findSig(ev.id) : '')} עם הערך ${c(ev.value)}` : `סיום ${esc(findSig(ev.id))}`;
    if (ev.type === 'print') return `הדפסה: ${c(ev.text)}`;
    return 'שגיאה בזמן ריצה';
  }
  function findFrame(id) {
    for (const e of events) if (e.type === 'call' && e.id === id) return { declLine: e.declLine, endLine: e.endLine, params: e.params };
    return null;
  }
  function findSig(id) {
    for (const e of events) if (e.type === 'call' && e.id === id) return e.sig;
    return '';
  }
  function updateChrome(st) {
    const ev = cur > 0 ? events[cur - 1] : null;
    whatEl.innerHTML = describe(ev);
    stepEl.textContent = `${cur}/${N}`;
    pbar.style.width = (N ? (cur / N) * 100 : 0) + '%';
    backBtn.disabled = cur <= 0;
    fwdBtn.disabled = compileError ? true : (!dirty && cur >= N);
    // פלט
    let html = '';
    if (compileError) html = `<span class="e">שגיאת קומפילציה, שורה ${compileError.line}: ${esc(compileError.msg)}</span>`;
    else if (st.out) html = esc(st.out);
    if (st.err) html += (html && !html.endsWith('\n') ? '\n' : '') + `<span class="e">${esc(st.err.msg)}</span>`;
    consoleEl.classList.toggle('empty', !html);
    consoleEl.innerHTML = html || 'הפלט של התוכנית יופיע כאן';
    updateRunBtn();
  }
  const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2.5v11l9.5-5.5z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 16 16"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1"/></svg>';
  function updateRunBtn() {
    let label = 'הרץ', icon = ICON_PLAY;
    if (playing) { label = 'השהה'; icon = ICON_PAUSE; }
    else if (!dirty && N > 0 && cur >= N) label = 'הרץ שוב';
    else if (!dirty && cur > 0) label = 'המשך';
    runBtn.innerHTML = icon + '<span>' + label + '</span>';
  }
  function setActive(ev) {
    if (!ev) { activeLine = 0; activeKind = ''; }
    else { activeLine = ev.line || 0; activeKind = ev.type === 'return' ? 'ret' : ev.type === 'error' ? 'err' : 'call'; }
    renderEditor(); revealLine(activeLine);
  }

  /* ---------- קומפילציה והרצה ---------- */
  function compile() {
    stopPlay(); resetViz();
    compileError = null; errLine = 0;
    try {
      progSrc = ta.value; progHl = highlight(progSrc); progRaw = progSrc.split('\n');
      events = runProgram(ta.value);
      N = events.length;
    } catch (e) {
      if (!(e instanceof CsError)) throw e;
      compileError = { msg: e.message, line: e.line };
      errLine = e.line; events = []; N = 0;
    }
    cur = 0; dirty = false;
    activeLine = 0; activeKind = '';
    const t = emptyEl.querySelector('h3'), p = emptyEl.querySelector('p');
    if (compileError) { t.textContent = 'יש שגיאה בקוד'; p.textContent = `שורה ${compileError.line}: ${compileError.msg}`; }
    else { t.textContent = 'לחצו על הרץ'; p.textContent = 'כל קריאה רקורסיבית תיפתח כאן בחלון חדש. החצים הכחולים יורדים בקריאה והכתומים עולים בחזרה. אפשר גם להתקדם צעד אחר צעד.'; }
    renderEditor();
    const st = stateAt(0);
    renderNote(st); updateChrome(st);
  }
  function ensureCompiled() { if (dirty) compile(); return !compileError; }

  function stepForward() {
    flush();
    if (cur >= N) return null;
    const ev = events[cur]; cur++;
    const k = cur;
    setActive(ev);
    const st = stateAt(k);
    if (ev.type === 'return') {
      markReturning(ev);
      later(700, () => reconcile(stateAt(k), true));
    } else reconcile(st, true);
    updateChrome(st);
    return ev;
  }
  function stepBack() {
    flush();
    if (cur <= 0) return;
    cur--;
    setActive(cur > 0 ? events[cur - 1] : null);
    const st = stateAt(cur);
    reconcile(st, true); updateChrome(st);
  }
  function delayFor(ev) {
    const base = ev.type === 'return' ? 1120 : ev.type === 'call' ? 900 : ev.type === 'print' ? 520 : 600;
    return Math.max(70, base * spdF);
  }
  function tick() {
    if (!playing) return;
    if (cur >= N) { stopPlay(); return; }
    const ev = stepForward();
    if (!ev) { stopPlay(); return; }
    playTimer = setTimeout(tick, delayFor(ev));
  }
  function startPlay() { playing = true; updateRunBtn(); tick(); }
  function stopPlay() { playing = false; clearTimeout(playTimer); updateRunBtn(); }

  runBtn.addEventListener('click', () => {
    if (playing) { stopPlay(); return; }
    if (dirty) compile();
    else if (cur >= N && N > 0) { resetViz(); cur = 0; setActive(null); const st = stateAt(0); renderNote(st); updateChrome(st); }
    if (compileError || N === 0) return;
    startPlay();
  });
  fwdBtn.addEventListener('click', () => { stopPlay(); if (!ensureCompiled()) return; stepForward(); });
  backBtn.addEventListener('click', () => { stopPlay(); stepBack(); });

  spdIn.addEventListener('input', () => {
    const m = SPEEDS[+spdIn.value];
    spdF = 1 / m;
    app.style.setProperty('--spd', String(spdF));
    spdOut.textContent = '×' + m;
  });
  spdIn.dispatchEvent(new Event('input'));

  /* ---------- עורך ---------- */
  function insertText(t) {
    ta.focus();
    let ok = false;
    try { ok = document.execCommand('insertText', false, t); } catch (e) { ok = false; }
    if (!ok) { ta.setRangeText(t, ta.selectionStart, ta.selectionEnd, 'end'); ta.dispatchEvent(new Event('input')); }
  }
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') { e.preventDefault(); insertText('    '); }
    else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runBtn.click(); }
    else if (e.key === 'Enter' && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      const before = ta.value.slice(0, ta.selectionStart);
      const ls = before.lastIndexOf('\n') + 1, line = before.slice(ls);
      const indent = /^[ \t]*/.exec(line)[0];
      insertText('\n' + indent + (/\{\s*$/.test(line) ? '    ' : ''));
    }
  });
  ta.addEventListener('input', () => {
    dirty = true; errLine = 0; activeLine = 0; activeKind = '';
    stopPlay();
    renderEditor();
    fwdBtn.disabled = false; updateRunBtn();
  });
  ta.addEventListener('scroll', syncScroll);
  window.addEventListener('resize', syncScroll);

  EXAMPLES.forEach((ex, i) => {
    const o = document.createElement('option');
    o.value = i; o.textContent = ex.name; exSel.appendChild(o);
  });
  exSel.addEventListener('change', () => {
    ta.value = EXAMPLES[+exSel.value].code;
    ta.scrollTop = 0; ta.scrollLeft = 0;
    dirty = true; compile();
  });

  ta.value = EXAMPLES[0].code;
  compile();
})();

</script>

</body></html>
